# Local development stack: governance state stores and the mock upstream.
# The gateway binary runs on the host during development and joins this
# file once containerized in the forwarding milestone.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: breakwater
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-breakwater}
      POSTGRES_DB: breakwater
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakwater -d breakwater"]
      interval: 5s
      timeout: 3s
      retries: 5

  mockllm:
    build:
      context: ..
      dockerfile: deploy/mockllm.Dockerfile
    image: breakwater/mockllm:dev
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
