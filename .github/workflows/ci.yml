# CI gate: formatting, vetting, linting, the race detector, the
# coverage floor and the deployment images.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned until the ubuntu-latest → 26 migration settles; a runner
    # bump must never be a surprise in an unrelated diff.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: breakwater
          POSTGRES_PASSWORD: breakwater
          POSTGRES_DB: breakwater
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U breakwater -d breakwater"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Test
        # The explicit timeout keeps a hung test from burning the job's
        # 15-minute budget on go test's default 10m plus a second full
        # attempt of the same wait.
        run: go test -race -timeout 8m ./...
        env:
          BREAKWATER_TEST_REDIS_ADDR: 127.0.0.1:6379
          BREAKWATER_TEST_POSTGRES_DSN: postgres://breakwater:breakwater@127.0.0.1:5432/breakwater?sslmode=disable

      # The coverage floor (>=95% per package) is a hard gate, matching
      # docs/TESTING.md. Plain -cover keeps this pass fast; the race
      # detector already ran above. The integration env is set here too:
      # the identity store's SQL coverage only exists when the
      # database-backed tests actually run.
      - name: Coverage floor
        run: |
          # The runner's default shell is bash -e (no pipefail); without
          # pipefail a failing go test would be masked by tee and the
          # gate would parse a half-written report as if it were green.
          set -eo pipefail
          go test -cover ./... | tee /tmp/cover.txt
          failed=0
          while IFS= read -r line; do
            # The trailing % keeps "[no statements]" lines (no ratio)
            # out of the parse and guarantees the grep below matches.
            case "$line" in
              *"coverage:"*"%"*)
                pct=$(printf '%s' "$line" | grep -oE '[0-9]+(\.[0-9]+)?%' | tr -d '%')
                if awk -v p="$pct" 'BEGIN { exit !(p + 0 < 95) }'; then
                  echo "::error::coverage below 95%: $line"
                  failed=1
                fi
                ;;
            esac
          done < /tmp/cover.txt
          exit $failed
        env:
          BREAKWATER_TEST_REDIS_ADDR: 127.0.0.1:6379
          BREAKWATER_TEST_POSTGRES_DSN: postgres://breakwater:breakwater@127.0.0.1:5432/breakwater?sslmode=disable

      # The compose deployment story builds these two images; a broken
      # Dockerfile must fail CI, not the next docker compose up.
      - name: Build gateway image
        run: docker build -f deploy/breakwater.Dockerfile -t breakwater/gateway:ci .

      - name: Build mock upstream image
        run: docker build -f deploy/mockllm.Dockerfile -t breakwater/mockllm:ci .
