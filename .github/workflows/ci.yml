# CI gate: formatting, vetting, linting, the race detector, the
# coverage floor, the deployment images and the merge-title rule.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    # Fast gate: the PR title becomes the squashed commit message on
    # merge, so it must already satisfy the Conventional Commits rule
    # the repo documents. Push events carry no title and skip this.
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|refactor|chore|test|perf)(\([^)]+\))?: .+'; then
            echo "::error::PR title must be a Conventional Commit — type(scope): subject, with type one of feat|fix|docs|refactor|chore|test|perf. The title becomes the squash-merge commit message."
            exit 1
          fi

  verify:
    # Pinned until the ubuntu-latest → 26 migration settles; a runner
    # bump must never be a surprise in an unrelated diff.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: breakwater
          POSTGRES_PASSWORD: breakwater
          POSTGRES_DB: breakwater
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U breakwater -d breakwater"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Fails the build when the code calls a known-vulnerable function
      # in a dependency or the standard library. The scanner version is
      # the go.mod tool directive — one source of truth for local and
      # CI, updated by Dependabot like any other dependency.
      - name: Vulnerability scan
        run: go tool govulncheck ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14

      # One full pass produces both verdicts: the race detector and the
      # per-package coverage report the floor step parses. The explicit
      # timeout keeps a hung test from burning the job's 15-minute
      # budget on go test's default 10m plus a second full attempt of
      # the same wait. pipefail is set because the runner's default
      # shell is bash -e — without it a failing go test would be masked
      # by tee and the floor would parse a half-written report.
      #
      # The deploy schema is applied once first, because three packages'
      # DSN-gated tests apply it themselves — from five call sites — and
      # go test runs packages concurrently: two of them can pass the same
      # IF NOT EXISTS check, and the loser's create fails on a duplicate
      # catalog key, which then cascades into every later test that needs
      # the rows. With the tables already in place each later apply is a
      # no-op.
      - name: Test
        run: |
          set -eo pipefail
          psql "$BREAKWATER_TEST_POSTGRES_DSN" -v ON_ERROR_STOP=1 -q -f deploy/schema.sql
          go test -race -cover -timeout 8m ./... | tee /tmp/cover.txt
        env:
          BREAKWATER_TEST_REDIS_ADDR: 127.0.0.1:6379
          # The credential pair belongs to the ephemeral postgres service
          # container declared above; it is not a repository secret.
          #checkov:skip=CKV_SECRET_4:throwaway credential of the ephemeral CI postgres service
          BREAKWATER_TEST_POSTGRES_DSN: postgres://breakwater:breakwater@127.0.0.1:5432/breakwater?sslmode=disable

      # The coverage floor (>=95% per package) is a hard gate, parsed
      # from the run the Test step already produced — the identity and
      # assessment stores keep a share of their SQL behind DSN-gated
      # tests, so the floor is only meaningful on that same run.
      - name: Coverage floor
        run: |
          failed=0
          while IFS= read -r line; do
            # The trailing % keeps "[no statements]" lines (no ratio)
            # out of the parse and guarantees the grep below matches.
            case "$line" in
              *"coverage:"*"%"*)
                pct=$(printf '%s' "$line" | grep -oE '[0-9]+(\.[0-9]+)?%' | tr -d '%')
                if awk -v p="$pct" 'BEGIN { exit !(p + 0 < 95) }'; then
                  echo "::error::coverage below 95%: $line"
                  failed=1
                fi
                ;;
            esac
          done < /tmp/cover.txt
          exit $failed

  deploy:
    # Image builds and the compose smoke: separate from verify so the code
    # gates and the deployment story run in parallel, and so this job never
    # pays for a Go toolchain it does not use.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The compose deployment story builds these two images; a broken
      # Dockerfile must fail CI, not the next docker compose up. The
      # GHA cache keeps the module-download and build layers between
      # runs, which is where a cold build spends most of its time; the
      # container-driver builder below is what supports exporting to it
      # (the default docker driver does not).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/breakwater.Dockerfile
          push: false
          load: true
          tags: breakwater/gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mock upstream image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/mockllm.Dockerfile
          push: false
          load: true
          tags: breakwater/mockllm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green image build does not prove the deployment story boots:
      # env wiring, health gates and the governance pipeline only show
      # up at runtime. Retag the images the steps above loaded and boot
      # the compose stack read-only — the override file drops the host
      # port publishes that would collide with this job's service
      # containers — then walk the core paths: readiness, the 401
      # rejection without credentials, and an authenticated completion
      # through the full chain (auth, redis limiter and quota, mock
      # upstream). The trap tears the stack down on any exit.
      - name: Smoke the compose stack
        run: |
          docker tag breakwater/gateway:ci breakwater/gateway:dev
          docker tag breakwater/mockllm:ci breakwater/mockllm:dev
          compose="docker compose -f deploy/docker-compose.yml -f deploy/ci-compose.override.yml"
          $compose up -d --no-build
          trap '$compose down -v' EXIT
          ready=0
          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8080/readyz > /dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then
            echo "::error::gateway never became ready"
            $compose logs --tail 50
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/healthz > /dev/null
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"smoke","messages":[{"role":"user","content":"ping"}],"max_tokens":8}')
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 without credentials, got $code"
            exit 1
          fi
          curl -fsS -X POST http://127.0.0.1:8080/v1/chat/completions \
            -H 'Authorization: Bearer bw-local-dev-key' \
            -H 'Content-Type: application/json' \
            -d '{"model":"smoke","messages":[{"role":"user","content":"ping"}],"max_tokens":8}' > /dev/null

  gate:
    # Merge-time summary: branch protection requires this check. It always
    # runs, passes when every job that ran succeeded (push events skip the
    # title gate - that is fine) and fails on any failure or cancellation,
    # so a cancelled run can never masquerade as green. Future jobs join the
    # needs list; the required-checks entry never changes.
    name: gate
    needs: [title, verify, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate gate results
        env:
          TITLE: ${{ needs.title.result }}
          VERIFY: ${{ needs.verify.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          results="title=$TITLE verify=$VERIFY deploy=$DEPLOY"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all triggered gates passed"
